[project]
name = "sistema-academico"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.5",
    "psycopg2>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: reglas aisladas, sin base de datos",
    "integration: servicio + repositorio con base de datos de prueba",
    "api: endpoints HTTP con TestClient",
]

# La cobertura de la clase se mide solo sobre el módulo de estudiantes.
[tool.coverage.run]
include = [
    "domain/estudiante.py",
    "application/services/estudiante_service.py",
    "infrastructure/repositories/estudiante_repository.py",
    "presentation/routers/estudiante_router.py",
]

[tool.coverage.report]
fail_under = 85
