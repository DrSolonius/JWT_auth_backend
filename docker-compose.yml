services:
  db:
    image: postgres:17
    container_name: sistema_academico_db
    environment:
      POSTGRES_DB: ${DB_NAME:-clase}
      POSTGRES_USER: ${DB_USER:-alumno}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mi_clave_segura}
    ports:
      # 5433 en tu PC para no chocar con un PostgreSQL local en 5432.
      - "${DB_PORT_HOST:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: sistema_academico_app
    environment:
      # Dentro de la red de Docker la base de datos se llama "db".
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-clase}
      DB_USER: ${DB_USER:-alumno}
      DB_PASSWORD: ${DB_PASSWORD:-mi_clave_segura}
      # Autenticación. Sin JWT_SECRET en el .env, compose se detiene con este mensaje.
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}
      ACCESS_TOKEN_MINUTOS: ${ACCESS_TOKEN_MINUTOS:-15}
      REFRESH_TOKEN_DIAS: ${REFRESH_TOKEN_DIAS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Sin ADMIN_PASSWORD no se crea el administrador.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@academico.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${APP_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: sistema_academico_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      # Solo desde tu PC: pgAdmin da acceso completo a la base de datos.
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data: